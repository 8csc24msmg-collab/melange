<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#8b5e3c">

<title>Melange</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f8f1e9;
    color:#3d2b20;
    padding-bottom:100px;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

/* HEADER */

header{
    background:#8b5e3c;
    color:white;
    text-align:center;
    padding:30px 18px 22px;
    border-radius:0 0 30px 30px;
}

.logo{
    font-family:Georgia,serif;
    font-size:37px;
    font-weight:700;
}

.subtitle{
    margin-top:5px;
    font-size:13px;
    opacity:.9;
}

/* SEARCH */

.search{
    max-width:650px;
    margin:17px auto 0;
    position:relative;
}

.search input{
    width:100%;
    border:0;
    outline:none;
    padding:13px 16px 13px 42px;
    border-radius:15px;
    background:white;
    color:#3d2b20;
}

.search-icon{
    position:absolute;
    left:15px;
    top:11px;
    font-size:18px;
}

/* CATEGORIES */

.categories{
    position:sticky;
    top:0;
    z-index:10;
    background:#f8f1e9;
    padding:11px 0 8px;
    overflow-x:auto;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category-list{
    display:flex;
    gap:8px;
    width:max-content;
    padding:0 15px;
}

.category-btn{
    border:1px solid #ddcabe;
    background:white;
    color:#604737;
    padding:8px 13px;
    border-radius:20px;
    font-size:13px;
}

.category-btn.active{
    background:#8b5e3c;
    color:white;
    border-color:#8b5e3c;
}

/* MENU */

.container{
    max-width:650px;
    margin:auto;
    padding:0 15px 30px;
}

.category{
    margin-top:23px;
}

.category-title{
    font-family:Georgia,serif;
    font-size:24px;
    margin-bottom:11px;
}

.item{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:9px;
    box-shadow:0 3px 12px rgba(70,45,25,.06);
}

.item-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.item-name{
    font-size:16px;
    font-weight:650;
    line-height:1.35;
}

.price{
    font-size:15px;
    font-weight:700;
    white-space:nowrap;
}

.cafe-note{
    margin-top:5px;
    color:#9a765d;
    font-size:12px;
}

.options{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:11px;
}

.option{
    border:1px solid #ddcabe;
    background:#fffaf6;
    color:#654b3b;
    padding:8px 10px;
    border-radius:10px;
    font-size:12px;
}

.option.active{
    background:#8b5e3c;
    color:white;
    border-color:#8b5e3c;
}

.add{
    width:100%;
    margin-top:10px;
    border:0;
    background:#8b5e3c;
    color:white;
    padding:11px;
    border-radius:12px;
    font-weight:650;
}

.add:active{
    transform:scale(.98);
}

.no-results{
    text-align:center;
    padding:50px 10px;
    color:#927e70;
}

.service-note{
    text-align:center;
    color:#927e70;
    font-size:12px;
    padding:20px 5px;
}

/* CART BAR */

.cart-bar{
    position:fixed;
    z-index:20;
    left:12px;
    right:12px;
    bottom:12px;
    max-width:625px;
    margin:auto;
    background:#3d2b20;
    color:white;
    padding:13px 15px;
    border-radius:19px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.cart-info{
    font-size:14px;
}

.cart-total{
    margin-top:2px;
    font-weight:700;
}

.cart-open{
    border:0;
    background:white;
    color:#3d2b20;
    padding:10px 16px;
    border-radius:12px;
    font-weight:700;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    background:rgba(0,0,0,.5);
    align-items:flex-end;
}

.modal-content{
    width:100%;
    max-width:650px;
    max-height:94vh;
    overflow:auto;
    margin:auto;
    background:#f8f1e9;
    border-radius:28px 28px 0 0;
    padding:21px;
}

.modal-title{
    font-family:Georgia,serif;
    font-size:25px;
    margin-bottom:14px;
}

/* CART ITEMS */

.cart-item{
    background:white;
    border-radius:15px;
    padding:12px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.cart-name{
    font-size:14px;
    font-weight:650;
}

.cart-price{
    color:#927e70;
    font-size:12px;
    margin-top:3px;
}

.quantity{
    display:flex;
    align-items:center;
    gap:7px;
    background:#f3e9e1;
    border-radius:11px;
    padding:4px;
}

.quantity button{
    border:0;
    background:white;
    color:#5b4030;
    width:28px;
    height:28px;
    border-radius:8px;
    font-weight:700;
}

.quantity span{
    min-width:18px;
    text-align:center;
    font-weight:650;
}

/* SUMMARY */

.summary{
    background:white;
    border-radius:16px;
    padding:14px;
    margin-top:13px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:8px;
}

.summary-total{
    border-top:1px solid #eaded5;
    padding-top:11px;
    margin-top:10px;
    margin-bottom:0;
    font-size:19px;
    font-weight:700;
}

/* NOTICE */

.notice{
    background:#f0e2d6;
    border-radius:14px;
    padding:12px;
    margin:12px 0;
    font-size:13px;
    line-height:1.45;
}

/* INPUT */

.input{
    width:100%;
    border:1px solid #ddcabe;
    background:white;
    border-radius:12px;
    padding:12px;
    margin-top:8px;
    outline:none;
}

.input:focus{
    border-color:#8b5e3c;
}

/* BUTTONS */

.whatsapp{
    width:100%;
    border:0;
    background:#25d366;
    color:white;
    padding:15px;
    border-radius:14px;
    margin-top:12px;
    font-weight:700;
}

.kaspi{
    width:100%;
    border:0;
    background:#e53935;
    color:white;
    padding:15px;
    border-radius:14px;
    margin-top:8px;
    font-weight:700;
}

.close{
    width:100%;
    border:0;
    background:#e7dbd1;
    color:#3d2b20;
    padding:13px;
    border-radius:14px;
    margin-top:8px;
    font-weight:650;
}

.empty{
    text-align:center;
    color:#927e70;
    padding:30px 5px;
}

</style>
</head>


<body>

    </div>

        Корзина

</div>


<!-- КОРЗИНА -->

<div
    class="modal"
    id="modal"
    onclick="outsideClose(event)"
>

    <div
        class="modal-content"
        onclick="event.stopPropagation()"
    >

        <div class="modal-title">
            Ваш заказ
        </div>


        <div id="cartItems"></div>


        <div class="summary">

            <div class="summary-row">

                <span>
                    Блюда
                </span>

                <span id="subtotal">
                    0 ₸
                </span>

            </div>


            <div class="summary-row">

                <span>
                    Обслуживание 10%
                </span>

                <span id="service">
                    0 ₸
                </span>

            </div>


            <div class="summary-row summary-total">

                <span>
                    Итого
                </span>

                <span id="total">
                    0 ₸
                </span>

            </div>

        </div>


        <div class="notice">

            📍 <b>Только самовывоз.</b>

            <br>

            Сначала отправьте заказ в WhatsApp,
            затем перейдите к оплате через Kaspi.

        </div>


        <input
            class="input"
            id="customerName"
            placeholder="Ваше имя"
        >


        <input
            class="input"
            id="customerPhone"
            type="tel"
            placeholder="Номер телефона"
        >


        <button
            class="whatsapp"
            onclick="sendWhatsApp()"

            💬 Отправить заказ в WhatsApp
        </button>


        <button
            class="kaspi"

            💳 Оплатить через Kaspi
        </button>


        <button
            class="close"
            onclick="closeCart()"
        >
            Закрыть
        </button>

    </div>

</div>

/* =====================================
   КОРЗИНА
===================================== */

let cart=[];


/* =====================================
   ФОРМАТ ЦЕНЫ
===================================== */

function money(value){

return Number(value)
.toLocaleString("ru-RU")+" ₸";

}


/* =====================================
   КАТЕГОРИИ
===================================== */

function renderCategories(){

const box =
document.getElementById("categoryButtons");

box.innerHTML="";

menu.forEach((category,index)=>{

const button =
document.createElement("button");

button.className=
"category-btn"+
(index===0 ? " active" : "");

button.textContent=
category.title;

button.onclick=()=>{

document
.querySelectorAll(".category-btn")
.forEach(x=>{
x.classList.remove("active");
});

button.classList.add("active");

document
.getElementById(category.id)
.scrollIntoView({
behavior:"smooth",
block:"start"
});

};

box.appendChild(button);

});

}


/* =====================================
   РЕНДЕР МЕНЮ
===================================== */

function renderMenu(filter=""){

const container =
document.getElementById("menu");

container.innerHTML="";

let found=false;


menu.forEach(category=>{

const matching =
category.items.filter(item=>
item[0]
.toLowerCase()
.includes(filter.toLowerCase())
);

if(!matching.length){
return;
}

found=true;


const section =
document.createElement("section");

section.className="category";

section.id=category.id;


const title =
document.createElement("div");

title.className="category-title";

title.textContent=
category.title;

section.appendChild(title);


matching.forEach(item=>{

const name=item[0];

const prices=item[1];


const card =
document.createElement("div");

card.className="item";


const top =
document.createElement("div");

top.className="item-top";


const nameEl =
document.createElement("div");

nameEl.className="item-name";

nameEl.textContent=name;


const priceEl =
document.createElement("div");

priceEl.className="price";


if(prices.length===1){

priceEl.textContent=
prices[0]===0
? "Цена уточняется"
: money(prices[0]);

}else{

priceEl.textContent=
money(prices[0])+
" / "+
money(prices[1]);

}


top.appendChild(nameEl);
top.appendChild(priceEl);

card.appendChild(top);


/* БОЛЬШОЙ РАЗМЕР */

if(
category.cafeLarge &&
prices.length>1
){

const note =
document.createElement("div");

note.className="cafe-note";

note.textContent=
"Большой размер — только в кафе";

card.appendChild(note);

}


/* ВАРИАНТЫ */

if(prices.length>1){

const options =
document.createElement("div");

options.className="options";


prices.forEach((price,index)=>{

const option =
document.createElement("button");

option.className=
"option"+
(index===0 ? " active" : "");

option.textContent=
money(price);

option.dataset.price=price;

option.onclick=()=>{

options
.querySelectorAll(".option")
.forEach(x=>{
x.classList.remove("active");
});

option.classList.add("active");

};

options.appendChild(option);

});


card.appendChild(options);

}


/* КНОПКА */

const add =
document.createElement("button");

add.className="add";

if(prices[0]===0){

add.textContent=
"Уточнить стоимость";

add.onclick=()=>{
alert(
"Стоимость десерта уточняется у официанта."
);
};

}else{

add.textContent="Добавить";

add.onclick=()=>{

let selectedPrice;

if(prices.length>1){

selectedPrice=
Number(
card
.querySelector(".option.active")
.dataset.price
);

}else{

selectedPrice=
prices[0];

}

addToCart(
name,
selectedPrice
);

};

}


card.appendChild(add);

section.appendChild(card);

});


container.appendChild(section);

});


if(!found){

container.innerHTML=
'<div class="no-results">Ничего не нашли 😔</div>';

}


const note =
document.createElement("div");

note.className="service-note";

note.textContent=
"Обслуживание — 10%";

container.appendChild(note);

}


/* =====================================
   ДОБАВИТЬ
===================================== */

function addToCart(name,price){

const existing =
cart.find(item=>
item.name===name &&
item.price===price
);

if(existing){

existing.quantity++;

}else{

cart.push({
name:name,
price:Number(price),
quantity:1
});

}

updateCart();

}


/* =====================================
   КОЛИЧЕСТВО
===================================== */

function changeQuantity(index,change){

cart[index].quantity+=change;

if(cart[index].quantity<=0){

cart.splice(index,1);

}

updateCart();

}


/* =====================================
   ИТОГИ
===================================== */

function calculate(){

let subtotal=0;

cart.forEach(item=>{

subtotal+=
item.price*
item.quantity;

});

const service=
Math.round(subtotal*0.10);

return{
subtotal:subtotal,
service:service,
total:subtotal+service
};

}


/* =====================================
   КОРЗИНА
===================================== */

function renderCart(){

const box =
document.getElementById("cartItems");


if(cart.length===0){

box.innerHTML=
'<div class="empty">Корзина пока пустая 🛒</div>';

}else{

box.innerHTML="";


cart.forEach((item,index)=>{

const row =
document.createElement("div");

row.className="cart-item";


row.innerHTML=`

<div style="flex:1">

<div class="cart-name">
${escapeHTML(item.name)}
</div>

<div class="cart-price">
${money(item.price)} за шт.
</div>

</div>

<div class="quantity">

<button onclick="changeQuantity(${index},-1)">
−
</button>

<span>
${item.quantity}
</span>

<button onclick="changeQuantity(${index},1)">
+
</button>

</div>

`;


box.appendChild(row);

});

}


const totals=calculate();


document
.getElementById("subtotal")
.textContent=
money(totals.subtotal);


document
.getElementById("service")
.textContent=
money(totals.service);


document
.getElementById("total")
.textContent=
money(totals.total);

}


/* =====================================
   ОБНОВИТЬ
===================================== */

function updateCart(){

const count =

function validateOrder(){

if(!cart.length){

alert("Корзина пустая.");

return false;

}


const name =
document
.getElementById("customerName")
.value
.trim();


const phone =
document
.getElementById("customerPhone")
.value
.trim();


if(!name){

alert("Введите ваше имя.");

return false;

}


if(!phone){

alert("Введите номер телефона.");

return false;

}


return true;

}

function sendWhatsApp(){

const name =
document
.getElementById("customerName")
.value
.trim();

document
.getElementById("customerPhone")
.value
.trim();

message+=
"\n📞 Телефон: "+
phone;

"\n📍 Самовывоз";

}


/* =====================================

===================================== */

function payKaspi(){

if(!validateOrder()) return;


const totals=calculate();


const order={

name:
document
.getElementById("customerName")
.value
.trim(),

phone:
document
.getElementById("customerPhone")
.value
.trim(),

items:cart,

subtotal:totals.subtotal,

service:totals.service,

total:totals.total,

createdAt:
new Date().toISOString()

};


localStorage.setItem(
"melange_order",
JSON.stringify(order)
);


window.open(
KASPI_LINK,
"_blank"
);

}

function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}
