<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

button,

.header{

.header-inner{

.logo{

.subtitle{

.search{

.search input{

  outline:0;
  background:#fff;

}

.search span{
  position:absolute;
  left:15px;
  top:11px;

}

.categories{
  position:sticky;
  top:0;
  z-index:8;
  background:#f8f1e9;
  padding:12px 0 8px;
  overflow-x:auto;
  white-space:nowrap;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category-scroll{
  display:flex;
  gap:8px;
  width:max-content;
  padding:0 15px;
}

.category-btn{
  border:1px solid #dfcfc2;
  background:#fff;
  color:#624a3b;
  border-radius:20px;
  padding:8px 13px;
  font-size:13px;
}

.category-btn.active{
  background:#8b5e3c;
  color:#fff;
  border-color:#8b5e3c;
}

.container{
  max-width:680px;
  margin:auto;
  padding:0 15px 30px;
}

.section{
  margin-top:22px;
}

.section-title{
  font-family:Georgia,serif;
  font-size:24px;
  margin-bottom:12px;
}

.card{
  background:#fff;
  border-radius:19px;
  margin-bottom:11px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(65,43,28,.06);
}

.card-photo{
  width:100%;
  height:150px;
  object-fit:cover;
  display:block;
}

.card-body{
  padding:14px;
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.name{
  font-size:16px;
  font-weight:650;
  line-height:1.3;
}

.price{
  white-space:nowrap;
  font-size:15px;
  font-weight:700;
}

.description{
  margin-top:4px;
  color:#927e70;
  font-size:12px;
}

.options{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:10px;
}

.option{
  border:1px solid #ddcfc5;
  background:#fffaf6;
  color:#654b3b;
  padding:7px 10px;
  border-radius:10px;
  font-size:12px;
}

.option.active{

  color:#fff;
  border-color:#8b5e3c;
}

.add{
  width:100%;
  margin-top:10px;
  border:0;
  background:#8b5e3c;
  color:#fff;
  border-radius:12px;
  padding:11px;
  font-weight:650;
}

.added{
  animation:pop .25s ease;
}

@keyframes pop{
  0%{transform:scale(.97)}
  100%{transform:scale(1)}
}

/* ==================================
   КОРЗИНА
================================== */

let cart=[];


/* ==================================
   ФОРМАТ ЦЕНЫ
================================== */

function money(value){
  return Number(value).toLocaleString("ru-RU")+" ₸";
}


/* ==================================
   КАТЕГОРИИ
================================== */

function renderCategories(){

  const box =
  document.getElementById("categoryButtons");

  box.innerHTML="";

  menu.forEach((cat,index)=>{

    const button =
    document.createElement("button");

    button.className =
    "category-btn"+
    (index===0 ? " active" : "");

    button.textContent =
    cat.title;

    button.onclick=()=>{

      document
      .querySelectorAll(".category-btn")
      .forEach(x=>x.classList.remove("active"));

      button.classList.add("active");

      document
      .getElementById(cat.id)
      .scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    };

    box.appendChild(button);

  });

}


/* ==================================
   РЕНДЕР МЕНЮ
================================== */

function renderMenu(filter=""){

  const container =
  document.getElementById("menu");

  container.innerHTML="";

  let found=false;

  menu.forEach(cat=>{

    const matching =
    cat.items.filter(item=>
      item[0]
      .toLowerCase()
      .includes(filter.toLowerCase())
    );

    if(!matching.length) return;

    found=true;

    const section =
    document.createElement("section");

    section.className="section";
    section.id=cat.id;

    section.innerHTML=
    `<div class="section-title">${cat.title}</div>`;

    matching.forEach(item=>{

      const name=item[0];
      const prices=item[1];

      const card =
      document.createElement("div");

      card.className="card";

      let options="";

      if(prices.length>1){

        options=`
        <div class="options">
        ${prices.map((p,i)=>`
          <button
            class="option ${i===0?"active":""}"
            data-price="${p}"
            onclick="chooseOption(this)"
          >
            ${money(p)}
          </button>
        `).join("")}
        </div>
        `;

      }

      let addButton="";

      if(prices.length===1){

        if(prices[0]===0){

          addButton=`
          <button
            class="add"
            onclick="alert('Стоимость уточняется у официанта.')"
          >
            Уточнить стоимость
          </button>
          `;

        }else{

          addButton=`
          <button
            class="add"
            onclick="addToCart('${escapeAttr(name)}',${prices[0]},this)"
          >
            Добавить
          </button>
          `;

        }

      }else{

        addButton=`
        <button
          class="add"
          onclick="addSelected('${escapeAttr(name)}',this)"
        >
          Добавить
        </button>
        `;

      }

      card.innerHTML=`

        <img
          class="card-photo"
          src="${cat.photo}"
          alt="${escapeAttr(name)}"
          loading="lazy"
        >

        <div class="card-body">

          <div class="card-top">

            <div class="name">
              ${name}
            </div>

            <div class="price">
              ${prices.length>1
                ? money(prices[0])+" / "+money(prices[1])
                : money(prices[0])
              }
            </div>

          </div>

          ${options}

          ${addButton}

        </div>
      `;

      section.appendChild(card);

    });

    container.appendChild(section);

  });


  if(!found){

    container.innerHTML=
    `<div class="no-results">
      Ничего не нашли 😔
    </div>`;

  }

}


/* ==================================
   ВЫБОР ВАРИАНТА
================================== */

function chooseOption(button){

  button
  .parentElement
  .querySelectorAll(".option")
  .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

}


/* ==================================
   ДОБАВИТЬ
================================== */

function addToCart(name,price,button){

  cart.push({
    name:name,
    price:Number(price),
    quantity:1
  });

  button.classList.add("added");

  setTimeout(()=>{
    button.classList.remove("added");
  },250);

  updateCart();

}


/* ==================================
   ДОБАВИТЬ ВЫБРАННЫЙ
================================== */

function addSelected(name,button){

  const options =
  button
  .parentElement
  .querySelector(".options");

  const selected =
  options.querySelector(".active");

  const price =
  Number(selected.dataset.price);

  addToCart(name,price,button);

}


/* ==================================
   ПОИСК
================================== */

function searchMenu(){

  const value =
  document
  .getElementById("search")
  .value
  .trim();

  renderMenu(value);

}


/* ==================================
   ИТОГИ
================================== */

function calculate(){

  let subtotal=0;

  cart.forEach(item=>{
    subtotal +=
    item.price * item.quantity;
  });

  const service =
  Math.round(subtotal*0.10);

  return {
    subtotal,
    service,
    total:subtotal+service
  };

}


/* ==================================
   ОБНОВИТЬ КОРЗИНУ
================================== */

function updateCart(){

  const count =
  cart.reduce(
    (sum,item)=>sum+item.quantity,
    0
  );

  const totals=calculate();

  document
  .getElementById("cartCount")
  .textContent=count;

  document
  .getElementById("barTotal")
  .textContent=money(totals.total);

  renderCart();

}


/* ==================================
   КОРЗИНА
================================== */

function renderCart(){

  const box =
  document.getElementById("cartItems");

  if(!cart.length){

    box.innerHTML=
    `<div class="empty">
      Корзина пока пустая 🛒
    </div>`;

  }else{

    box.innerHTML="";

    cart.forEach((item,index)=>{

      const row =
      document.createElement("div");

      row.className="cart-product";

      row.innerHTML=`

        <div style="flex:1">

          <div class="cart-name">
            ${escapeHTML(item.name)}
          </div>

          <div class="cart-price">
            ${money(item.price)} за шт.
          </div>

        </div>

        <div class="quantity">

          <button onclick="changeQuantity(${index},-1)">
            −
          </button>

          <span>
            ${item.quantity}
          </span>

          <button onclick="changeQuantity(${index},1)">
            +
          </button>

        </div>

      `;

      box.appendChild(row);

    });

  }

  const totals=calculate();

  document
  .getElementById("subtotal")
  .textContent=money(totals.subtotal);

  document
  .getElementById("service")
  .textContent=money(totals.service);

  document
  .getElementById("total")
  .textContent=money(totals.total);

}


/* ==================================
   КОЛИЧЕСТВО
================================== */

function changeQuantity(index,change){

  cart[index].quantity += change;

  if(cart[index].quantity<=0){

    cart.splice(index,1);

  }

  updateCart();

}


/* ==================================
   ОТКРЫТЬ
================================== */

function openCart(){

  document
  .getElementById("modal")
  .style.display="flex";

  renderCart();

}


/* ==================================
   ЗАКРЫТЬ
================================== */

function closeCart(){

  document
  .getElementById("modal")
  .style.display="none";

}


/* ==================================
   ФОН
================================== */

function outsideClose(event){

  if(event.target.id==="modal"){
    closeCart();
  }

}


/* ==================================
   ПРОВЕРКА
================================== */

function validateOrder(){

  if(!cart.length){

    alert("Добавьте что-нибудь в корзину.");

    return false;

  }

  const name =
  document
  .getElementById("customerName")
  .value
  .trim();

  const phone =
  document
  .getElementById("customerPhone")
  .value
  .trim();

  if(!name){

    alert("Введите ваше имя.");

    return false;

  }

  if(!phone){

    alert("Введите номер телефона.");

    return false;

  }

  return true;

}


/* ==================================
   WHATSAPP
================================== */

function sendWhatsApp(){

  if(!validateOrder()) return;

  const name =
  document
  .getElementById("customerName")
  .value
  .trim();

  const phone =
  document
  .getElementById("customerPhone")
  .value
  .trim();

  const totals=calculate();

  let message=
  "🍽️ НОВЫЙ ЗАКАЗ MELANGE\n\n";

  cart.forEach(item=>{

    message +=
    "• "+
    item.name+
    " × "+
    item.quantity+
    " — "+
    money(item.price*item.quantity)+
    "\n";

  });

  message +=
  "\nБлюда: "+
  money(totals.subtotal);

  message +=
  "\nОбслуживание 10%: "+
  money(totals.service);

  message +=
  "\n💰 ИТОГО: "+
  money(totals.total);

  message +=
  "\n\n👤 Имя: "+
  name;

  message +=
  "\n📞 Телефон: "+
  phone;

  message +=
  "\n📍 Получение: самовывоз";

  const url=
  "https://wa.me/"+
  WHATSAPP_NUMBER+
  "?text="+
  encodeURIComponent(message);

  window.open(url,"_blank");

}


/* ==================================
   KASPI
================================== */

function payKaspi(){

  if(!validateOrder()) return;

  const totals=calculate();

  localStorage.setItem(
    "melange_order",
    JSON.stringify({
      customer:
      document
      .getElementById("customerName")
      .value
      .trim(),

      phone:
      document
      .getElementById("customerPhone")
      .value
      .trim(),

      items:cart,

      subtotal:totals.subtotal,

      service:totals.service,

      total:totals.total,

      createdAt:new Date().toISOString()
    })
  );

  window.open(KASPI_LINK,"_blank");

}


/* ==================================
   БЕЗОПАСНЫЙ ТЕКСТ
================================== */

function escapeHTML(text){

  return String(text)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}

function escapeAttr(text){

  return String(text)
  .replace(/\\/g,"\\\\")
  .replace(/'/g,"\\'");

}


/* ==================================
   СТАРТ
================================== */

renderCategories();
renderMenu();
updateCart();
