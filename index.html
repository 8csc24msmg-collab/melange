<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8B5E3C">
<title>Melange</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --brown:#8b5e3c;
  --dark:#3d2b21;
  --milk:#f8f1e9;
  --cream:#fffaf5;
  --beige:#ead8c5;
  --muted:#927b6c;
  --line:#eee2d8;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--milk);
  color:var(--dark);
  padding-bottom:90px;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.header{
  background:var(--brown);
  color:white;
  padding:30px 20px 34px;
  border-radius:0 0 30px 30px;
}

.logo{
  font-family:Georgia,serif;
  font-size:40px;
  font-weight:bold;
}

.header p{
  margin-top:6px;
  opacity:.85;
  font-size:14px;
}

main{
  max-width:600px;
  margin:auto;
  padding:22px 16px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.welcome{
  margin-bottom:22px;
}

.welcome p{
  color:var(--brown);
  font-size:14px;
  font-weight:600;
}

.welcome h2{
  font-family:Georgia,serif;
  font-size:25px;
  margin-top:5px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:25px;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  white-space:nowrap;
  padding:10px 15px;
  border-radius:25px;
  background:var(--cream);
  color:var(--brown);
  border:1px solid var(--beige);
}

.category.active{
  background:var(--brown);
  color:white;
}

.section-title{
  font-family:Georgia,serif;
  margin-bottom:14px;
}

.products{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.product{
  background:var(--cream);
  border-radius:22px;
  padding:14px;
  display:flex;
  gap:14px;
  box-shadow:0 5px 20px rgba(70,45,25,.06);
}

.product-img{
  width:85px;
  height:85px;
  border-radius:18px;
  background:var(--beige);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  flex-shrink:0;
}

.product-info{
  flex:1;
}

.product-info h3{
  font-family:Georgia,serif;
  font-size:18px;
  margin-bottom:5px;
}

.product-info p{
  color:var(--muted);
  font-size:12px;
  line-height:1.35;
}

.product-bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:9px;
}

.price{
  color:var(--brown);
  font-weight:bold;
}

.add{
  width:38px;
  height:38px;
  border-radius:13px;
  background:var(--brown);
  color:white;
  font-size:23px;
}

.favorite{
  background:transparent;
  font-size:22px;
  color:#a88c79;
  margin-left:5px;
}

.card{
  background:var(--cream);
  border-radius:22px;
  padding:19px;
  margin-bottom:15px;
  box-shadow:0 5px 20px rgba(70,45,25,.06);
}

.cart-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--line);
}

.cart-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.quantity{
  display:flex;
  align-items:center;
  gap:8px;
}

.quantity button{
  width:29px;
  height:29px;
  border-radius:9px;
  background:var(--beige);
  color:var(--brown);
}

.total{
  display:flex;
  justify-content:space-between;
  padding:18px 0;
  font-size:18px;
  font-weight:bold;
}

.total strong{
  color:var(--brown);
}

.primary{
  width:100%;
  padding:15px;
  border-radius:15px;
  background:var(--brown);
  color:white;
  font-weight:700;
}

.secondary{
  width:100%;
  padding:14px;
  border-radius:15px;
  background:var(--beige);
  color:var(--brown);
  font-weight:600;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

.field{
  margin-top:15px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid var(--beige);
  border-radius:13px;
  background:white;
  outline:none;
}

input:focus,select:focus{
  border-color:var(--brown);
}

.payment{
  background:var(--beige);
  padding:15px;
  border-radius:15px;
  margin:18px 0;
}

.payment small{
  display:block;
  color:var(--muted);
  margin-bottom:5px;
}

.payment strong{
  color:var(--brown);
}

.order-item{
  display:flex;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}

.profile-icon{
  width:70px;
  height:70px;
  border-radius:50%;
  background:var(--beige);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  margin-bottom:14px;
}

.order-history{
  margin-top:15px;
}

.history-item{
  padding:14px 0;
  border-bottom:1px solid var(--line);
}

.history-item strong{
  color:var(--brown);
}

.success{
  text-align:center;
  padding:35px 10px;
}

.success-icon{
  font-size:65px;
  margin-bottom:15px;
}

.success h2{
  font-family:Georgia,serif;
  margin-bottom:10px;
}

.success p{
  color:var(--muted);
  line-height:1.5;
}

.bottom{
  position:fixed;
  z-index:100;
  left:10px;
  right:10px;
  bottom:10px;
  height:66px;
  background:rgba(255,250,245,.97);
  border:1px solid var(--beige);
  border-radius:22px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 7px 25px rgba(60,40,25,.13);
}

.nav{
  background:transparent;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:20px;
}

.nav small{
  font-size:10px;
}

.nav.active{
  color:var(--brown);
}

.badge{
  background:var(--brown);
  color:white;
  font-size:9px;
  min-width:16px;
  height:16px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:absolute;
  margin-left:20px;
  margin-top:-5px;
}

.back{
  background:transparent;
  color:var(--brown);
  margin-bottom:18px;
}

@media(max-width:380px){
  main{
    padding-left:12px;
    padding-right:12px;
  }

  .logo{
    font-size:36px;
  }

  .product-img{
    width:75px;
    height:75px;
    font-size:34px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">Melange</div>
  <p>Кофе, который хочется повторить ☕</p>
</header>

<main>

<!-- ГЛАВНАЯ -->

<section id="home" class="page active">

  <div class="welcome">
    <p>Добро пожаловать 🤎</p>
    <h2>Что будем пить сегодня?</h2>
  </div>

  <div class="categories">
    <button class="category active">☕ Кофе</button>
    <button class="category">🍵 Чай</button>
    <button class="category">🍰 Десерты</button>
  </div>

  <h2 class="section-title">Популярное</h2>

  <div class="products" id="products"></div>

</section>


<!-- КОРЗИНА -->

<section id="cartPage" class="page">

  <button class="back" onclick="showPage('home')">
    ← Назад
  </button>

  <h2 class="section-title">🛒 Корзина</h2>

  <div class="card">

    <div id="cartItems"></div>

    <div class="total">
      <span>Итого</span>
      <strong id="cartTotal">0 ₸</strong>
    </div>

    <button class="primary" onclick="openCheckout()">
      Оформить заказ
    </button>

  </div>

</section>


<!-- ИЗБРАННОЕ -->

<section id="favorites" class="page">

  <h2 class="section-title">♡ Избранное</h2>

  <div id="favoriteItems"></div>

</section>


<!-- ПРОФИЛЬ -->

<section id="profile" class="page">

  <div class="card">

    <div class="profile-icon">👤</div>

    <h2>Мой профиль</h2>

    <div class="field">
      <label>Имя</label>
      <input id="profileName" placeholder="Ваше имя">
    </div>

    <div class="field">
      <label>Телефон</label>
      <input id="profilePhone" placeholder="+7 700 000 00 00">
    </div>

    <br>

    <button class="primary" onclick="saveProfile()">
      Сохранить
    </button>

  </div>

  <div class="card order-history">

    <h2>История заказов</h2>

    <div id="history"></div>

  </div>

</section>


<!-- ОФОРМЛЕНИЕ -->

<section id="checkout" class="page">

  <button class="back" onclick="showPage('cartPage')">
    ← Вернуться в корзину
  </button>

  <div class="card">

    <h2>Оформление заказа 🤎</h2>

    <div class="field">
      <label>Имя</label>
      <input id="name" placeholder="Введите имя">
    </div>

    <div class="field">
      <label>Телефон</label>
      <input id="phone" type="tel" placeholder="+7 700 000 00 00">
    </div>

    <div class="field">
      <label>Способ получения</label>

      <select id="delivery" onchange="deliveryChanged()">
        <option value="Самовывоз">Самовывоз</option>
        <option value="Доставка">Доставка</option>
      </select>

    </div>

    <div class="field" id="addressField" style="display:none">
      <label>Адрес доставки</label>
      <input id="address" placeholder="Введите адрес">
    </div>

  </div>


  <div class="card">

    <h2>Ваш заказ</h2>

    <div id="checkoutItems"></div>

    <div class="total">
      <span>К оплате</span>
      <strong id="checkoutTotal">0 ₸</strong>
    </div>

  </div>


  <div class="payment">

    <small>Способ оплаты</small>

    <strong>💳 Банковская карта</strong>

  </div>

  <button class="primary" onclick="pay()">
    💳 Оплатить картой
  </button>

</section>


<!-- УСПЕШНО -->

<section id="success" class="page">

  <div class="card success">

    <div class="success-icon">🤎</div>

    <h2>Заказ оформлен!</h2>

    <p id="successText">
      Спасибо за заказ в Melange.
    </p>

    <br>

    <button class="primary" onclick="showPage('home')">
      Вернуться в меню
    </button>

  </div>

</section>

</main>


<!-- НИЖНЕЕ МЕНЮ -->

<nav class="bottom">

  <button class="nav active" onclick="showPage('home')">
    <span>⌂</span>
    <small>Главная</small>
  </button>

  <button class="nav" onclick="showPage('cartPage')">
    <span>
      🛍
      <i id="badge" class="badge">0</i>
    </span>
    <small>Корзина</small>
  </button>

  <button class="nav" onclick="showPage('favorites')">
    <span>♡</span>
    <small>Избранное</small>
  </button>

  <button class="nav" onclick="showPage('profile')">
    <span>♙</span>
    <small>Профиль</small>
  </button>

</nav>


<script>

const products = [

  {
    id:1,
    name:"Капучино",
    description:"Нежный кофе с молочной пенкой",
    price:1200,
    icon:"☕"
  },

  {
    id:2,
    name:"Латте",
    description:"Мягкий кофе с большим количеством молока",
    price:1300,
    icon:"🥛"
  },

  {
    id:3,
    name:"Матча",
    description:"Нежный японский чай с молоком",
    price:1400,
    icon:"🍵"
  },

  {
    id:4,
    name:"Американо",
    description:"Классический крепкий кофе",
    price:1000,
    icon:"☕"
  },

  {
    id:5,
    name:"Чизкейк",
    description:"Нежный сливочный десерт",
    price:1500,
    icon:"🍰"
  }

];


let cart = [];
let favorites = [];
let orders = [];


/* ТОВАРЫ */

function renderProducts(){

  const container =
    document.getElementById("products");

  container.innerHTML = "";

  products.forEach(function(product){

    const favorite =
      favorites.includes(product.id);

    container.innerHTML += `

      <div class="product">

        <div class="product-img">
          ${product.icon}
        </div>

        <div class="product-info">

          <h3>${product.name}</h3>

          <p>${product.description}</p>

          <div class="product-bottom">

            <span class="price">
              ${product.price.toLocaleString("ru-RU")} ₸
            </span>

            <div>

              <button
                class="favorite"
                onclick="toggleFavorite(${product.id})">

                ${favorite ? "♥" : "♡"}

              </button>

              <button
                class="add"
                onclick="addToCart(${product.id})">

                +

              </button>

            </div>

          </div>

        </div>

      </div>
    `;

  });

}


/* КОРЗИНА */

function addToCart(id){

  const product =
    products.find(p => p.id === id);

  const existing =
    cart.find(item => item.id === id);

  if(existing){

    existing.quantity++;

  }else{

    cart.push({
      ...product,
      quantity:1
    });

  }

  updateCart();

}


function changeQuantity(id, amount){

  const item =
    cart.find(item => item.id === id);

  if(!item) return;

  item.quantity += amount;

  if(item.quantity <= 0){

    cart =
      cart.filter(item => item.id !== id);

  }

  updateCart();

}


function updateCart(){

  const container =
    document.getElementById("cartItems");

  const badge =
    document.getElementById("badge");

  let total = 0;
  let count = 0;

  if(cart.length === 0){

    container.innerHTML =
      `<div class="empty">
        Корзина пока пустая ☕
      </div>`;

  }else{

    container.innerHTML = "";

    cart.forEach(function(item){

      const sum =
        item.price * item.quantity;

      total += sum;
      count += item.quantity;

      container.innerHTML += `

        <div class="cart-item">

          <div class="cart-left">

            <span>${item.icon}</span>

            <div>
              <strong>${item.name}</strong>
              <div>${item.price.toLocaleString("ru-RU")} ₸</div>
            </div>

          </div>

          <div class="quantity">

            <button onclick="changeQuantity(${item.id},-1)">
              −
            </button>

            <span>${item.quantity}</span>

            <button onclick="changeQuantity(${item.id},1)">
              +
            </button>

          </div>

        </div>
      `;

    });

  }

  document.getElementById("cartTotal").textContent =
    total.toLocaleString("ru-RU") + " ₸";

  badge.textContent = count;

  updateCheckout();

}


/* ИЗБРАННОЕ */

function toggleFavorite(id){

  if(favorites.includes(id)){

    favorites =
      favorites.filter(item => item !== id);

  }else{

    favorites.push(id);

  }

  renderProducts();
  renderFavorites();

}


function renderFavorites(){

  const container =
    document.getElementById("favoriteItems");

  const list =
    products.filter(p => favorites.includes(p.id));

  if(list.length === 0){

    container.innerHTML =
      `<div class="card empty">
        Здесь пока ничего нет 🤎
      </div>`;

    return;

  }

  container.innerHTML = "";

  list.forEach(function(product){

    container.innerHTML += `

      <div class="product">

        <div class="product-img">
          ${product.icon}
        </div>

        <div class="product-info">

          <h3>${product.name}</h3>

          <p>${product.description}</p>

          <div class="product-bottom">

            <span class="price">
              ${product.price.toLocaleString("ru-RU")} ₸
            </span>

            <button
              class="add"
              onclick="addToCart(${product.id})">
              +
            </button>

          </div>

        </div>

      </div>

    `;

  });

}


/* ОФОРМЛЕНИЕ */

function openCheckout(){

  if(cart.length === 0){

    alert("Сначала добавьте товар в корзину ☕");

    return;

  }

  updateCheckout();

  showPage("checkout");

}


function updateCheckout(){

  const container =
    document.getElementById("checkoutItems");

  const totalElement =
    document.getElementById("checkoutTotal");

  if(!container) return;

  container.innerHTML = "";

  let total = 0;

  cart.forEach(function(item){

    const sum =
      item.price * item.quantity;

    total += sum;

    container.innerHTML += `

      <div class="order-item">

        <span>
          ${item.name} × ${item.quantity}
        </span>

        <strong>
          ${sum.toLocaleString("ru-RU")} ₸
        </strong>

      </div>

    `;

  });

  totalElement.textContent =
    total.toLocaleString("ru-RU") + " ₸";

}


function deliveryChanged(){

  const delivery =
    document.getElementById("delivery").value;

  document.getElementById("addressField").style.display =
    delivery === "Доставка" ? "block" : "none";

}


/* ОПЛАТА */

function pay(){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const delivery =
    document.getElementById("delivery").value;

  const address =
    document.getElementById("address").value.trim();


  if(!name){

    alert("Введите имя 🤎");
    return;

  }


  if(!phone){

    alert("Введите номер телефона 📱");
    return;

  }


  if(delivery === "Доставка" && !address){

    alert("Введите адрес доставки 📍");
    return;

  }


  const total =
    cart.reduce(
      (sum,item) =>
        sum + item.price * item.quantity,
      0
    );


  orders.push({
    name:name,
    phone:phone,
    total:total,
    date:new Date().toLocaleDateString("ru-RU")
  });


  document.getElementById("successText").textContent =
    `Спасибо, ${name}! Заказ на ${total.toLocaleString("ru-RU")} ₸ создан.`;

  cart = [];

  updateCart();
  renderHistory();

  showPage("success");

}


/* ПРОФИЛЬ */

function saveProfile(){

  const name =
    document.getElementById("profileName").value;

  const phone =
    document.getElementById("profilePhone").value;

  localStorage.setItem(
    "melangeName",
    name
  );

  localStorage.setItem(
    "melangePhone",
    phone
  );

  alert("Профиль сохранён 🤎");

}


function loadProfile(){

  document.getElementById("profileName").value =
    localStorage.getItem("melangeName") || "";

  document.getElementById("profilePhone").value =
    localStorage.getItem("melangePhone") || "";

}


/* ИСТОРИЯ */

function renderHistory(){

  const container =
    document.getElementById("history");

  if(orders.length === 0){

    container.innerHTML =
      `<div class="empty">
        Заказов пока нет
      </div>`;

    return;

  }

  container.innerHTML = "";

  orders.slice().reverse().forEach(function(order){

    container.innerHTML += `

      <div class="history-item">

        <strong>
          ${order.total.toLocaleString("ru-RU")} ₸
        </strong>

        <div>
          ${order.date}
        </div>

        <small>
          ${order.name}
        </small>

      </div>

    `;

  });

}


/* НАВИГАЦИЯ */

function showPage(id){

  document
    .querySelectorAll(".page")
    .forEach(page =>
      page.classList.remove("active")
    );

  document
    .getElementById(id)
    .classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ЗАПУСК */

renderProducts();
renderFavorites();
updateCart();
renderHistory();
loadProfile();

</script>

</body>
</html>
