<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8b5e3c">
<title>Melange</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f8f1e9;
color:#3d2b21;
padding-bottom:100px
}

button,input{font:inherit}
button{border:0;cursor:pointer}

.header{
background:#8b5e3c;
color:white;
padding:30px 20px;
border-radius:0 0 30px 30px
}

.logo{
font-family:Georgia,serif;
font-size:40px;
font-weight:bold
}

.header p{
margin-top:6px;
opacity:.85
}

main{
max-width:650px;
margin:auto;
padding:22px 16px
}

.page{display:none}
.page.active{display:block}

h2{
font-family:Georgia,serif;
margin-bottom:16px
}

.welcome{margin-bottom:22px}

.welcome p{
color:#8b5e3c;
font-weight:600;
margin-bottom:5px
}

.categories{
display:flex;
gap:8px;
overflow-x:auto;
margin-bottom:25px;
padding-bottom:5px
}

.category{
white-space:nowrap;
padding:10px 15px;
border-radius:25px;
background:#fffaf5;
color:#8b5e3c;
border:1px solid #ead8c5
}

.category.active{
background:#8b5e3c;
color:white
}

.menu-section{
margin-bottom:30px
}

.menu-title{
font-family:Georgia,serif;
font-size:24px;
margin-bottom:12px;
color:#5b3825
}

.products{
display:flex;
flex-direction:column;
gap:10px
}

.product{
background:#fffaf5;
border-radius:18px;
padding:14px;
box-shadow:0 5px 20px rgba(70,45,25,.06)
}

.product-top{
display:flex;
justify-content:space-between;
gap:10px
}

.product-name{
font-family:Georgia,serif;
font-size:17px;
font-weight:bold
}

.product-price{
color:#8b5e3c;
font-weight:bold;
white-space:nowrap
}

.product-actions{
display:flex;
align-items:flex-end;
justify-content:space-between;
margin-top:10px
}

.size-buttons{
display:flex;
gap:6px;
flex-wrap:wrap
}

.size-btn,
.syrup-btn{
padding:7px 11px;
border-radius:10px;
background:#ead8c5;
color:#6b4936;
font-size:12px
}

.size-btn.active,
.syrup-btn.active{
background:#8b5e3c;
color:white
}

.syrup-box{
margin-top:9px
}

.syrup-title{
font-size:12px;
color:#765c49;
margin-bottom:6px
}

.syrups{
display:flex;
gap:5px;
flex-wrap:wrap
}

.add{
width:40px;
height:40px;
border-radius:13px;
background:#8b5e3c;
color:white;
font-size:24px
}

.favorite{
background:transparent;
color:#8b5e3c;
font-size:23px;
margin-right:8px
}

.card{
background:#fffaf5;
border-radius:22px;
padding:19px;
margin-bottom:16px;
box-shadow:0 5px 20px rgba(70,45,25,.06)
}

.cart-item,
.order-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #eee2d8
}

.cart
