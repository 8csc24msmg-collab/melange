<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melange</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <h1>Melange</h1>
  <p>Кофе, который хочется повторить ☕</p>
</header>

<main>

  <h2>Меню</h2>

  <div class="card">
    <div class="product-image">☕</div>
    <h3>Капучино</h3>
    <p>1 200 ₸</p>

    <button onclick="addToCart()">
      Добавить в корзину
    </button>
  </div>

  <section class="cart-section">

    <h2>🛒 Корзина</h2>

    <p id="cartText">Корзина пуста</p>

    <h3 id="total">Итого: 0 ₸</h3>

    <button onclick="checkout()">
      Оформить заказ
    </button>

  </section>

</main>

<script>

let cart = 0;
let total = 0;

function addToCart() {

  cart = cart + 1;
  total = total + 1200;

  document.getElementById("cartText").textContent =
    "Капучино × " + cart;

  document.getElementById("total").textContent =
    "Итого: " + total + " ₸";
}


function checkout() {

  if (cart === 0) {

    alert("Сначала добавьте кофе в корзину ☕");

    return;
  }

  alert(
    "Оформление заказа 🤎\n\n" +
    "Сумма: " + total + " ₸"
  );

}

</script>

</body>
</html>
