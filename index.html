<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8b5e3c">
<title>Melange</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f8f1e9;
color:#3d2b20;
padding-bottom:100px
}

header{
background:#8b5e3c;
color:#fff;
text-align:center;
padding:30px 20px 26px;
border-radius:0 0 30px 30px
}

.logo{
font-size:36px;
font-weight:700;
letter-spacing:1px
}

.subtitle{
margin-top:5px;
font-size:14px;
opacity:.9
}

.container{
max-width:650px;
margin:auto;
padding:15px
}

.category{
margin-top:25px
}

.category-title{
font-size:23px;
font-weight:700;
margin-bottom:12px
}

.item{
background:#fff;
border-radius:18px;
padding:16px;
margin-bottom:10px;
box-shadow:0 3px 12px rgba(70,45,25,.07)
}

.item-top{
display:flex;
justify-content:space-between;
gap:12px
}

.item-name{
font-weight:650;
font-size:16px;
line-height:1.35
}

.price{
font-weight:700;
white-space:nowrap;
font-size:15px
}

.desc{
font-size:12px;
color:#917b6c;
margin-top:5px
}

.options{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:11px
}

.option{
border:1px solid #d9c5b6;
background:#fffaf6;
color:#5d4435;
padding:8px 10px;
border-radius:10px;
font-size:13px;
cursor:pointer
}

.option.active{
background:#8b5e3c;
color:white;
border-color:#8b5e3c
}

.add{
width:100%;
margin-top:11px;
border:0;
background:#8b5e3c;
color:#fff;
padding:11px;
border-radius:12px;
font-size:14px;
font-weight:650;
cursor:pointer
}

.add:active{
transform:scale(.98)
}

.cart-bar{
position:fixed;
z-index:20;
left:12px;
right:12px;
bottom:12px;
max-width:620px;
margin:auto;
background:#3d2b20;
color:white;
border-radius:18px;
padding:14px 16px;
display:flex;
align-items:center;
justify-content:space-between;
box-shadow:0 8px 30px rgba(0,0,0,.25)
}

.cart-open{
border:0;
background:#fff;
color:#3d2b20;
padding:10px 16px;
border-radius:12px;
font-weight:700
}

.modal{
display:none;
position:fixed;
inset:0;
z-index:30;
background:rgba(0,0,0,.5);
align-items:flex-end
}

.modal-content{
background:#f8f1e9;
width:100%;
max-width:650px;
max-height:92vh;
overflow:auto;
margin:auto;
padding:22px;
border-radius:28px 28px 0 0
}

.modal-title{
font-size:23px;
font-weight:700;
margin-bottom:14px
}

.cart-item{
background:#fff;
border-radius:14px;
padding:13px;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.cart-item-name{
font-weight:600
}

.cart-item-price{
font-size:13px;
color:#856f61;
margin-top:3px
}

.delete{
border:0;
background:#eee0d5;
color:#704d39;
padding:7px 9px;
border-radius:9px
}

.summary{
background:#fff;
border-radius:16px;
padding:15px;
margin-top:14px
}

.summary-row{
display:flex;
justify-content:space-between;
margin-bottom:8px;
font-size:14px
}

.summary-row.total{
font-size:19px;
font-weight:700;
border-top:1px solid #eaded5;
padding-top:10px;
margin-top:8px;
margin-bottom:0
}

.notice{
background:#f0e3d7;
border-radius:14px;
padding:12px;
font-size:13px;
line-height:1.4;
margin:12px 0
}

input{
width:100%;
border:1px solid #dccbbd;
border-radius:12px;
padding:12px;
margin-top:9px;
font-size:14px;
outline:none
}

input:focus{
border-color:#8b5e3c
}

.whatsapp{
width:100%;
border:0;
background:#25d366;
color:white;
padding:15px;
border-radius:14px;
font-size:15px;
font-weight:700;
margin-top:12px
}

.kaspi{
width:100%;
border:0;
background:#e53935;
color:white;
padding:15px;
border-radius:14px;
font-size:15px;
font-weight:700;
margin-top:9px
}

.close{
width:100%;
border:0;
background:#e8dbd0;
color:#3d2b20;
padding:13px;
border-radius:14px;
font-weight:600;
margin-top:9px
}

.empty{
text-align:center;
color:#917b6c;
padding:25px 5px
}

.service{
font-size:12px;
color:#8d7768;
text-align:center;
margin-top:15px
}

.select{
width:100%;
margin-top:10px;
padding:11px;
border:1px solid #dccbbd;
border-radius:11px;
background:#fff;
color:#3d2b20
}
</style>
</head>

<body>

<header>
<div class="logo">Melange</div>
<div class="subtitle">Кафе • завтраки • кофе • кухня</div>
</header>

<div class="container" id="menu"></div>

<div class="cart-bar">
<div>🛒 Корзина: <b id="cartCount">0</b></div>
<button class="cart-open" onclick="openCart()">Открыть</button>
</div>

<div class="modal" id="modal" onclick="outsideClose(event)">
<div class="modal-content" onclick="event.stopPropagation()">

<div class="modal-title">🛒 Ваш заказ</div>

<div id="cartItems"></div>

<div class="summary">

<div class="summary-row">
<span>Блюда</span>
<span id="foodTotal">0 ₸</span>
</div>

<div class="summary-row">
<span>Обслуживание 10%</span>
<span id="serviceTotal">0 ₸</span>
</div>

<div class="summary-row total">
<span>Итого</span>
<span id="grandTotal">0 ₸</span>
</div>

</div>

<div class="notice">
📍 <b>Только самовывоз.</b><br>
После оформления отправьте заказ в WhatsApp. Затем можно перейти к оплате через Kaspi.
</div>

<input
id="customerName"
placeholder="Ваше имя"
>

<input
id="customerPhone"
placeholder="Номер телефона"
type="tel"
>

<button
class="whatsapp"
onclick="sendWhatsApp()"
>
💬 Отправить заказ в WhatsApp
</button>

<button
class="kaspi"
onclick="payKaspi()"
>
💳 Оплатить через Kaspi
</button>

<button
class="close"
onclick="closeCart()"
>
Закрыть
</button>

</div>
</div>


<script>

/* ============================

============================ */

const WHATSAPP = "77712787999";

const KASPI =
"https://pay.kaspi.kz/pay/ndmk0ruy";


/* ============================

const menu = [

},

},

["Шакшука","1 650"],
["Каша овсяная","900"],

["Каша рисовая","900"],

},

{

items:[

]
},

{

]
},

{
title:"🍖 ГОРЯЧИЕ БЛЮДА",
items:[

["Бараньи рёбра","3 450"],
["Турецкие котлетки","3 150"],
["Стейк из сёмги","5 800"],

["Курица в сливочном соусе","2 550"],
["Вареники с творогом","1 650"],
["Вареники с вишней","1 650"],
["Вареники с картофелем","1 650"],
["Пельмени с говядиной","1 500"]

]
},

{
title:"🍝 ПАСТА",
items:[

["Фетучини с курицей и грибами","2 400"],

]
},

{

items:[

["4 сезона (30 см)","2 700"]

]
},

{
title:"🍔 ФАСТФУД",
items:[

["Гамбургер","1 600"],
["Чикенбургер","1 550"],
["Мини-бургер","2 450"],
["Сэндвич с курицей","950"],
["Сэндвич с колбасой","850"],
["Тост с сыром","700"],
["Картофель фри","750"],
["Картофельные дольки","1 000"],
["Сырные палочки (7 шт)","1 700"],
["Чебуречки (7 шт)","1 650"],
["Жареные пельмени (15 шт)","1 500"]

]
},

{
title:"🍰 ДЕСЕРТЫ",
items:[

["В ассортименте — уточнять у официанта","0"]

]
}

];


/* ============================
   КОРЗИНА
============================ */

let cart=[];


/* ============================
   ЧИСЛО ИЗ ЦЕНЫ
============================ */

function parsePrice(value){

return Number(
String(value)
.replace(/\s/g,"")
.replace(/₸/g,"")
.replace(",",".")
);

}


/* ============================
   СОЗДАНИЕ МЕНЮ
============================ */

function renderMenu(){

const container =
document.getElementById("menu");

container.innerHTML="";


menu.forEach((category)=>{

const section =
document.createElement("section");

section.className="category";

section.innerHTML=
`<div class="category-title">
${category.title}
</div>`;


category.items.forEach(item=>{

const name=item[0];
const prices=item[1];

const values=prices
.split("/")
.map(x=>x.trim());

const card=
document.createElement("div");

card.className="item";


let buttons="";

if(values.length>1){

buttons=
`<div class="options">
${values.map((price,index)=>`

<button
class="option ${index===0?"active":""}"
onclick="selectPrice(this)"
data-price="${parsePrice(price)}"
>
${price} ₸
</button>

`).join("")}
</div>`;

}else{

buttons=
`<button
class="add"
onclick="addSingle('${safe(name)}',${parsePrice(values[0])})"
>
Добавить
</button>`;

}


if(values.length>1){

buttons+=
`<button
class="add"
onclick="addSelected(this,'${safe(name)}')"
>
Добавить
</button>`;

}


card.innerHTML=`

<div class="item-top">

<div class="item-name">
${name}
</div>

<div class="price">
${prices} ₸
</div>

</div>

${buttons}

`;


section.appendChild(card);

});


container.appendChild(section);

});


const serviceNote=
document.createElement("div");

serviceNote.className="service";

serviceNote.textContent=
"Обслуживание — 10%";

container.appendChild(serviceNote);

}


/* ============================
   ВЫБОР ЦЕНЫ
============================ */

function selectPrice(button){

const parent=
button.parentElement;

parent
.querySelectorAll(".option")
.forEach(x=>x.classList.remove("active"));

button.classList.add("active");

}


/* ============================
   ДОБАВИТЬ ОДИНАКОВУЮ ЦЕНУ
============================ */

function addSingle(name,price){

if(price<=0){

alert("Цена уточняется у официанта.");

return;

}

cart.push({
name:name,
price:price
});

updateCart();

}


/* ============================
   ДОБАВИТЬ ВЫБРАННУЮ ЦЕНУ
============================ */

function addSelected(button,name){

const options=
button.parentElement
.querySelector(".options");

const selected=
options.querySelector(".active");

const price=
Number(selected.dataset.price);

if(price<=0){

alert("Цена уточняется у официанта.");

return;

}

cart.push({
name:name,
price:price
});

updateCart();

}


/* ============================
   УДАЛИТЬ
============================ */

function removeItem(index){

cart.splice(index,1);

updateCart();

}


/* ============================
   ОБНОВЛЕНИЕ
============================ */

function updateCart(){

document
.getElementById("cartCount")
.textContent=cart.length;


const box=
document.getElementById("cartItems");


if(cart.length===0){

box.innerHTML=
'<div class="empty">Корзина пока пустая</div>';

document
.getElementById("foodTotal")
.textContent="0 ₸";

document
.getElementById("serviceTotal")
.textContent="0 ₸";

document
.getElementById("grandTotal")
.textContent="0 ₸";

return;

}


box.innerHTML="";

let subtotal=0;


cart.forEach((item,index)=>{

subtotal+=item.price;

const row=
document.createElement("div");

row.className="cart-item";

row.innerHTML=`

<div>

<div class="cart-item-name">
${escapeHTML(item.name)}
</div>

<div class="cart-item-price">
${format(item.price)} ₸
</div>

</div>

<button
class="delete"
onclick="removeItem(${index})"
>
Удалить
</button>

`;

box.appendChild(row);

});


const service=
Math.round(subtotal*0.10);

const total=
subtotal+service;


document
.getElementById("foodTotal")
.textContent=
format(subtotal)+" ₸";


document
.getElementById("serviceTotal")
.textContent=
format(service)+" ₸";


document
.getElementById("grandTotal")
.textContent=
format(total)+" ₸";

}


/* ============================
   ФОРМАТ
============================ */

function format(number){

return Number(number)
.toLocaleString("ru-RU");

}


/* ============================
   ОТКРЫТЬ
============================ */

function openCart(){

document
.getElementById("modal")
.style.display="flex";

updateCart();

}


/* ============================
   ЗАКРЫТЬ
============================ */

function closeCart(){

document
.getElementById("modal")
.style.display="none";

}


/* ============================
   КЛИК ПО ФОНУ
============================ */

function outsideClose(event){

if(event.target.id==="modal"){
closeCart();
}

}


/* ============================
   ПРОВЕРКА
============================ */

function validate(){

if(cart.length===0){

alert("Корзина пустая.");

return false;

}


const name=
document
.getElementById("customerName")
.value
.trim();


const phone=
document
.getElementById("customerPhone")
.value
.trim();


if(!name){

alert("Введите ваше имя.");

return false;

}


if(!phone){

alert("Введите номер телефона.");

return false;

}


return true;

}


/* ============================
   WHATSAPP
============================ */

function sendWhatsApp(){

if(!validate()) return;


const name=
document
.getElementById("customerName")
.value
.trim();


const phone=
document
.getElementById("customerPhone")
.value
.trim();


let subtotal=0;


let message=
"🍽️ НОВЫЙ ЗАКАЗ MELANGE\n\n";


message+="Заказ:\n";


cart.forEach(item=>{

subtotal+=item.price;

message+=
"• "+
item.name+
" — "+
format(item.price)+
" ₸\n";

});


const service=
Math.round(subtotal*0.10);

const total=
subtotal+service;


message+=
"\nБлюда: "+
format(subtotal)+
" ₸";


message+=
"\nОбслуживание 10%: "+
format(service)+
" ₸";


message+=
"\n💰 ИТОГО: "+
format(total)+
" ₸";


message+=
"\n\n👤 Имя: "+
name;


message+=
"\n📞 Телефон: "+
phone;


message+=
"\n📍 Самовывоз";


const url=
"https://wa.me/"+
WHATSAPP+
"?text="+
encodeURIComponent(message);


window.open(url,"_blank");

}


/* ============================
   KASPI
============================ */

function payKaspi(){

if(!validate()) return;


const name=
document
.getElementById("customerName")
.value
.trim();


const phone=
document
.getElementById("customerPhone")
.value
.trim();


let subtotal=0;


cart.forEach(item=>{
subtotal+=item.price;
});


const service=
Math.round(subtotal*0.10);

const total=
subtotal+service;


const order={

name:name,

phone:phone,

items:cart,

subtotal:subtotal,

service:service,

total:total,

createdAt:new Date().toISOString()

};


localStorage.setItem(
"melange_last_order",
JSON.stringify(order)
);


window.open(
KASPI,
"_blank"
);

}


/* ============================
   ЗАЩИТА ТЕКСТА
============================ */

function safe(text){

return text
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


function escapeHTML(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ============================
   ЗАПУСК
============================ */

renderMenu();

updateCart();

</script>

</body>
</html>
