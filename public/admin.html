<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melange — Админка</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f8f1e9;
  color: #3d2b21;
  padding: 15px;
}

.container {
  max-width: 800px;
  margin: auto;
}

.header {
  background: #8b5e3c;
  color: white;
  padding: 25px 20px;
  border-radius: 0 0 25px 25px;
  margin: -15px -15px 20px;
}

.logo {
  font-family: Georgia, serif;
  font-size: 32px;
  font-weight: bold;
}

.header p {
  margin-top: 5px;
  opacity: .85;
}

.toolbar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

.refresh {
  flex: 1;
  border: none;
  border-radius: 14px;
  padding: 14px;
  background: #8b5e3c;
  color: white;
  font-weight: bold;
  font-size: 15px;
}

.count {
  background: white;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #ead8c5;
}

.order {
  background: #fffaf5;
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 5px 20px rgba(70,45,25,.08);
}

.order-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.order-number {
  color: #8b5e3c;
  font-weight: bold;
  font-size: 18px;
}

.status {
  background: #ead8c5;
  color: #8b5e3c;
  padding: 6px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
}

.info {
  line-height: 1.7;
  margin-bottom: 15px;
}

.items {
  border-top: 1px solid #eee2d8;
  border-bottom: 1px solid #eee2d8;
  padding: 10px 0;
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
}

.total {
  display: flex;
  justify-content: space-between;
  padding-top: 15px;
  font-size: 18px;
  font-weight: bold;
}

.total strong {
  color: #8b5e3c;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 15px;
}

.buttons button {
  border: none;
  border-radius: 10px;
  padding: 10px 12px;
  background: #ead8c5;
  color: #6d4b36;
}

.empty,
.loading {
  background: #fffaf5;
  border-radius: 20px;
  padding: 40px 20px;
  text-align: center;
  color: #927b6c;
}

.error {
  background: #ffe8e4;
  color: #a33a2b;
  border-radius: 15px;
  padding: 15px;
  margin-bottom: 15px;
}

@media (max-width: 500px) {
  .toolbar {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="container">

  <header class="header">
    <div class="logo">Melange 🤎</div>
    <p>Панель управления заказами</p>
  </header>

  <div class="toolbar">

    <button class="refresh" onclick="loadOrders()">
      🔄 Обновить заказы
    </button>

    <div class="count">
      Заказов: <strong id="count">0</strong>
    </div>

  </div>

  <div id="message"></div>

  <div id="orders">
    <div class="loading">
      Загружаем заказы...
    </div>
  </div>

</div>

<script>

const API =
  "https://melange-3.onrender.com";


/* =========================
   ЗАГРУЗКА ЗАКАЗОВ
========================= */

async function loadOrders() {

  const container =
    document.getElementById("orders");

  const message =
    document.getElementById("message");

  container.innerHTML =
    `<div class="loading">
      Загружаем заказы...
    </div>`;

  message.innerHTML = "";

  try {

    const response =
      await fetch(
        API + "/api/orders"
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const orders =
      await response.json();

    document.getElementById("count")
      .textContent = orders.length;

    if (
      !Array.isArray(orders) ||
      orders.length === 0
    ) {

      container.innerHTML =
        `<div class="empty">
          🛒<br><br>
          Пока заказов нет
        </div>`;

      return;
    }

    container.innerHTML = "";

    orders.forEach(order => {

      createOrder(
        order,
        container
      );

    });

  } catch (error) {

    console.error(error);

    container.innerHTML = "";

    message.innerHTML = `
      <div class="error">
        ❌ Не удалось загрузить заказы.
        <br><br>
        Сервер: ${API}
        <br>
        Ошибка: ${error.message}
      </div>
    `;

  }

}


/* =========================
   СОЗДАНИЕ КАРТОЧКИ
========================= */

function createOrder(
  order,
  container
) {

  const element =
    document.createElement("div");

  element.className = "order";


  let itemsHTML = "";


  if (Array.isArray(order.items)) {

    order.items.forEach(item => {

      const quantity =
        Number(item.quantity) || 1;

      const price =
        Number(item.price) || 0;

      const sum =
        price * quantity;

      itemsHTML += `
        <div class="item">

          <span>
            ${item.icon || "☕"}
            ${escapeHTML(item.name)}
            × ${quantity}
          </span>

          <strong>
            ${sum.toLocaleString("ru-RU")} ₸
          </strong>

        </div>
      `;

    });

  }


  let date = "—";

  if (order.created_at) {

    date =
      new Date(
        order.created_at
      ).toLocaleString("ru-RU");

  }


  element.innerHTML = `

    <div class="order-top">

      <div class="order-number">
        Заказ №${order.id}
      </div>

      <div class="status">
        ${escapeHTML(order.status || "Новый")}
      </div>

    </div>


    <div class="info">

      👤 <b>Имя:</b>
      ${escapeHTML(order.name)}

      <br>

      📱 <b>Телефон:</b>
      ${escapeHTML(order.phone)}

      <br>

      🚚 <b>Получение:</b>
      ${escapeHTML(order.delivery)}

      ${
        order.address
        ? `
          <br>
          📍 <b>Адрес:</b>
          ${escapeHTML(order.address)}
        `
        : ""
      }

      <br>

      🕐 <b>Время:</b>
      ${date}

    </div>


    <div class="items">

      ${itemsHTML}

    </div>


    <div class="total">

      <span>Итого</span>

      <strong>
        ${Number(order.total)
          .toLocaleString("ru-RU")} ₸
      </strong>

    </div>


    <div class="buttons">

      <button
        onclick="changeStatus(${order.id}, 'Новый')">
        🆕 Новый
      </button>

      <button
        onclick="changeStatus(${order.id}, 'Готовится')">
        ☕ Готовится
      </button>

      <button
        onclick="changeStatus(${order.id}, 'Готов')">
        ✅ Готов
      </button>

      <button
        onclick="changeStatus(${order.id}, 'Выдан')">
        🤎 Выдан
      </button>

    </div>

  `;

  container.appendChild(element);

}


/* =========================
   ИЗМЕНЕНИЕ СТАТУСА
========================= */

async function changeStatus(
  id,
  status
) {

  try {

    const response =
      await fetch(
        API +
        "/api/orders/" +
        id +
        "/status",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            status: status
          })
        }
      );


    const result =
      await response.json();


    if (!response.ok) {

      throw new Error(
        result.error ||
        "Ошибка"
      );

    }


    await loadOrders();


  } catch (error) {

    alert(
      "Не удалось изменить статус:\n" +
      error.message
    );

  }

}


/* =========================
   ЗАЩИТА ТЕКСТА
========================= */

function escapeHTML(text) {

  return String(text || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================
   ЗАПУСК
========================= */

loadOrders();


/* Автообновление каждые 10 секунд */

setInterval(
  loadOrders,
  10000
);

</script>

</body>
</html>
